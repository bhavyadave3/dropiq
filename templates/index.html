<!DOCTYPE html>
<html>
<head>
    <title>Dropiq</title>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>

<div class="top-bar">
    <div class="branding">Dropiq</div>
</div>

<div class="main-card">

    <!-- Upload Dropdown -->
    <div class="dropdown">
        <button id="uploadBtn" class="upload-btn">Upload</button>

        <div id="dropdownMenu" class="dropdown-content hidden">
            <label>
                Upload Files
                <input type="file" id="fileInput" multiple hidden>
            </label>
            <label>
                Upload Folder
                <input type="file" id="folderInput" webkitdirectory hidden>
            </label>
        </div>
    </div>

    <!-- Text Button (same style & size) -->
    <a href="/text" class="upload-btn" style="display:inline-block; margin-top:20px;">
        Text
    </a>

    <!-- Drag Area -->
    <div id="dropArea" class="hidden">Drop Files Here</div>

    <!-- Preview -->
    <div id="preview"></div>

    <!-- Message -->
    <div id="message"></div>

    <!-- Download Links -->
    <div id="downloadLinks"></div>

</div>

<script>
const uploadBtn = document.getElementById("uploadBtn");
const dropdown = document.getElementById("dropdownMenu");
const fileInput = document.getElementById("fileInput");
const folderInput = document.getElementById("folderInput");
const preview = document.getElementById("preview");
const dropArea = document.getElementById("dropArea");

/* Toggle dropdown */
uploadBtn.onclick = (e) => {
    e.stopPropagation();
    dropdown.classList.toggle("hidden");
};

/* Close dropdown outside */
window.addEventListener("click", function(e) {
    if (!uploadBtn.contains(e.target) && !dropdown.contains(e.target)) {
        dropdown.classList.add("hidden");
    }
});

/* File selection */
fileInput.onchange = () => upload(fileInput.files, "/upload_files");
folderInput.onchange = () => upload(folderInput.files, "/upload_folder");

/* Drag behavior */
window.addEventListener("dragenter", () => {
    dropArea.classList.remove("hidden");
});

window.addEventListener("dragleave", () => {
    dropArea.classList.add("hidden");
});

dropArea.addEventListener("dragover", e => e.preventDefault());

dropArea.addEventListener("drop", e => {
    e.preventDefault();
    dropArea.classList.add("hidden");
    upload(e.dataTransfer.files, "/upload_files");
});

/* Upload function */
function upload(files, url) {
    preview.innerHTML = "";
    let formData = new FormData();

    document.getElementById("message").innerText = "Uploading...";

    [...files].forEach(file => {
        formData.append(url.includes("folder") ? "folder" : "files", file);

        let div = document.createElement("div");
        div.className = "file-item";
        div.innerText = file.name;
        preview.appendChild(div);
    });

    let xhr = new XMLHttpRequest();
    xhr.open("POST", url);

    xhr.onload = () => {
        let res = JSON.parse(xhr.responseText);
        document.getElementById("message").innerText = res.message;

        let links = document.getElementById("downloadLinks");
        links.innerHTML = "";

        res.files.forEach(file => {
            let a = document.createElement("a");
            a.href = "/download/" + file;
            a.innerText = "Download " + file;
            a.className = "download-btn";
            links.appendChild(a);
        });
    };

    xhr.send(formData);
}
</script>

</body>
</html>
